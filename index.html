<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Hub</title>
<meta name="description" content="Free project management tools: SDLC timeline planner, activity tracker, individual KPIs and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>
/* theme: white page, light-blue header band */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --sky-50:#F5F9FF; --sky-100:#EAF3FE; --sky-200:#D3E5FB; --line:#DCE7F5; --line-soft:#EDF3FB;
  --ink:#0F2340; --muted:#5B6E88; --accent:#1C6FE0; --accent-ink:#FFFFFF;
  --st-notstarted:#3D8FE6; --st-inprogress:#22A55B; --st-atrisk:#F2BE2C; --st-blocker:#E5484D; --st-done:#A9B3C1;
  --f-ui:"Plus Jakarta Sans","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
a{color:var(--accent)}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header + footer (drawn by nav.js) */
.hub-top{position:sticky;top:0;z-index:20;background:var(--sky-100);border-bottom:1px solid var(--sky-200)}
.hub-top-in{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:12px}
.hub-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;margin-right:auto}
.hub-foot{margin-top:auto;padding:24px 0 28px;text-align:center;font-size:12px;color:var(--muted)}
.hub-foot b{color:var(--accent);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sky-200);background:var(--bg);border-radius:8px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#155BBE;color:var(--accent-ink)}

/* hub page */
.hero{padding:48px 0 28px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero h1{margin:6px 0 8px;font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.01em}
.hero p{margin:0;max-width:62ch;color:var(--muted);font-size:15px}
#tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:32px}
@media(max-width:860px){#tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){#tools{grid-template-columns:minmax(0,1fr)}}
#tools section{display:flex;flex-direction:column;min-width:0}
.group-title{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.tools{display:flex;flex-direction:column;flex:1}
.tools .tool{flex:1}
/* a second card of the same group keeps the title row for alignment, but hides the repeated name */
.group-title.cont{visibility:hidden}
.tool{display:flex;flex-direction:column;gap:10px;border:1px solid var(--sky-200);border-radius:14px;padding:20px;background:var(--bg);text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
a.tool:hover{border-color:var(--accent);box-shadow:0 10px 28px rgba(28,111,224,.14);transform:translateY(-2px)}
.tool-ic{width:44px;height:44px;border-radius:11px;background:var(--sky-100);display:grid;place-items:center;color:var(--accent)}
.tool h2{margin:0;font-size:17px}
.tool p{margin:0;color:var(--muted);font-size:13px;flex:1}
.tool .go{font-size:13px;font-weight:600;color:var(--accent)}
.tool-foot{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.tool .by{font-size:11.5px;color:var(--muted)}
.tool.soon>.by{filter:none;opacity:1}
.tool.soon{background:var(--sky-50);cursor:default;user-select:none;overflow:hidden}
.tool.soon>*{filter:blur(3px);opacity:.75}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--sky-50);border:1px solid var(--sky-200);border-radius:var(--r);padding:12px 16px;font-size:13px;color:var(--muted);margin-bottom:32px}
.privacy b{color:var(--ink)}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>Project Management Hub</h1>
    <p>A toolkit to help you work better</p>
  </section>
  <div id="tools"></div>
  <div class="privacy"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M10 2 4 4.5v5c0 3.7 2.6 6.8 6 8 3.4-1.2 6-4.3 6-8v-5z" fill="none" stroke="#1C6FE0" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span><b>Your work stays on your device.</b> Everything you create is saved in this browser only and is never sent to a server. Use the export or backup option in each tool to keep a copy.</span></div>
</main>
<script>
/* header + footer; PMHub.tools loads tools.json for the cards */
(function(){
  var root="./";
  var LOGO='<svg width="28" height="28" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#1C6FE0"/><path d="M5 7h9l2 1.5-2 1.5H5z" fill="#fff"/><path d="M9 11.5h11l2 1.5-2 1.5H9z" fill="#BFDBFE"/><path d="M7 16h8l2 1.5-2 1.5H7z" fill="#fff"/></svg>';

  var top=document.createElement("header"); top.className="hub-top";
  top.innerHTML='<div class="wrap hub-top-in"><a class="hub-brand" href="'+root+'">'+LOGO+'<span>PM Hub</span></a></div>';
  document.body.insertBefore(top,document.body.firstChild);

  var foot=document.createElement("footer"); foot.className="hub-foot";
  foot.innerHTML='&copy; 2026 <b>Navarat Veerawongchai</b> All rights reserved.';
  document.body.appendChild(foot);

  window.PMHub={root:root,tools:fetch(root+"tools.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(d){return d.tools||[]})};
})();
</script>
<script>
(function(){
  var ICONS={
    timeline:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="9" height="3.5" rx="1.2" fill="currentColor"/><rect x="8" y="10.25" width="11" height="3.5" rx="1.2" fill="currentColor" opacity=".55"/><rect x="5" y="15.5" width="8" height="3.5" rx="1.2" fill="currentColor"/></svg>',
    tracker:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5 5.5 8 8 5M4 12.5 5.5 14 8 11M4 18.5 5.5 20 8 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.5 6.5H20M11.5 12.5H20M11.5 18.5H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    kpi:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="13" width="4" height="7" rx="1.2" fill="currentColor"/><rect x="10" y="9" width="4" height="11" rx="1.2" fill="currentColor"/><rect x="16" y="4" width="4" height="16" rx="1.2" fill="currentColor"/></svg>',
    risk:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1.2" fill="currentColor" opacity=".35"/><rect x="9.5" y="3" width="5" height="5" rx="1.2" fill="currentColor" opacity=".65"/><rect x="16" y="3" width="5" height="5" rx="1.2" fill="currentColor"/><rect x="3" y="9.5" width="5" height="5" rx="1.2" fill="currentColor" opacity=".2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.2" fill="currentColor" opacity=".35"/><rect x="16" y="9.5" width="5" height="5" rx="1.2" fill="currentColor" opacity=".65"/><rect x="3" y="16" width="5" height="5" rx="1.2" fill="currentColor" opacity=".12"/><rect x="9.5" y="16" width="5" height="5" rx="1.2" fill="currentColor" opacity=".2"/><rect x="16" y="16" width="5" height="5" rx="1.2" fill="currentColor" opacity=".35"/></svg>',
    roadmap:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h7M3 12h11M3 17.5h15"/><circle cx="13" cy="6.5" r="2" fill="currentColor" stroke="none"/><circle cx="17" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="21" cy="17.5" r="1.8" fill="currentColor" stroke="none"/></svg>',
    wbs:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="9" y="3" width="6" height="4.5" rx="1"/><rect x="2.5" y="16.5" width="6" height="4.5" rx="1"/><rect x="15.5" y="16.5" width="6" height="4.5" rx="1"/><path d="M12 7.5v4.5M5.5 16.5V12h13v4.5"/></svg>'
  };
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  PMHub.tools.then(function(tools){
    function card(t){
      var live=t.status==="live", ic=ICONS[t.icon]||ICONS.timeline;
      var body='<div class="tool-ic">'+ic+'</div><h2>'+esc(t.name)+'</h2><p>'+esc(t.description)+'</p>';
      // tools still being built show as a blurred preview: the group title says what is coming
      // small "by" line from the builders list in tools.json
      var names=(t.builders||[]).map(function(b){return b.name}).filter(Boolean), by=names.length?'<span class="by">by '+esc(names.join(" & "))+'</span>':'';
      return live?'<a class="tool" href="'+esc(t.path)+'">'+body+'<span class="tool-foot"><span class="go">Open tool →</span>'+by+'</span></a>':'<div class="tool soon" aria-hidden="true">'+body+by+'</div>';
    }
    // groups appear in the order tools.json first mentions them
    var groups=[];
    tools.forEach(function(t){var g=t.group||"Tools";if(groups.indexOf(g)<0)groups.push(g)});
    // one card per grid cell, three per row; cards of a group sit side by side under one title
    var box=document.getElementById("tools"), cells=[];
    groups.forEach(function(g){tools.filter(function(t){return (t.group||"Tools")===g}).forEach(function(t,i){cells.push({g:g,t:t,first:i===0})})});
    box.innerHTML=cells.map(function(c){
      return '<section aria-label="'+esc(c.g)+'"><h2 class="group-title"'+(c.first?'':' aria-hidden="true"')+'>'+esc(c.g)+'</h2><div class="tools">'+card(c.t)+'</div></section>';
    }).join("");
    // a repeated group name shows only when its card starts a new row
    function titles(){
      var n=getComputedStyle(box).gridTemplateColumns.split(" ").length;
      [].forEach.call(box.children,function(el,i){el.firstChild.classList.toggle("cont",!cells[i].first&&i%n!==0)});
    }
    titles(); window.addEventListener("resize",titles);
  });
})();
</script>
</body>
</html>
