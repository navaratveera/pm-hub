<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Hub</title>
<meta name="description" content="Free project management tools: SDLC timeline planner, activity tracker, individual KPIs and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<link rel="stylesheet" href="shared/theme.css?v=2">
<style>
.hero{padding:48px 0 28px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero h1{margin:6px 0 8px;font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.01em}
.hero p{margin:0;max-width:62ch;color:var(--muted);font-size:15px}
#tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:32px}
@media(max-width:860px){#tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){#tools{grid-template-columns:minmax(0,1fr)}}
#tools section{display:flex;flex-direction:column;min-width:0}
.group-title{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.tools{display:flex;flex-direction:column;gap:16px;flex:1}
.tools .tool{flex:1}
.tool{display:flex;flex-direction:column;gap:10px;border:1px solid var(--sky-200);border-radius:14px;padding:20px;background:var(--bg);text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
a.tool:hover{border-color:var(--accent);box-shadow:0 10px 28px rgba(28,111,224,.14);transform:translateY(-2px)}
.tool-ic{width:44px;height:44px;border-radius:11px;background:var(--sky-100);display:grid;place-items:center;color:var(--accent)}
.tool h2{margin:0;font-size:17px}
.tool p{margin:0;color:var(--muted);font-size:13px;flex:1}
.tool .go{font-size:13px;font-weight:600;color:var(--accent)}
.tool.soon{background:var(--sky-50);cursor:default;user-select:none;overflow:hidden}
.tool.soon>*{filter:blur(3px);opacity:.75}
.tool.soon>.by{filter:none;opacity:1}
.tool-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--sky-100);padding-top:12px;margin-top:2px}
.by{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--muted)}
.by b{color:var(--ink);font-weight:600}
.avs{display:flex;flex-shrink:0}
.av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);letter-spacing:.02em}
.av+.av{margin-left:-8px}
.tool.soon .by{border-top:1px solid var(--sky-200);padding-top:12px}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--sky-50);border:1px solid var(--sky-200);border-radius:var(--r);padding:12px 16px;font-size:13px;color:var(--muted);margin-bottom:32px}
.privacy b{color:var(--ink)}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>Project Management Hub</h1>
    <p>A toolkit to help you work better</p>
  </section>
  <div id="tools"></div>
  <div class="privacy"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M10 2 4 4.5v5c0 3.7 2.6 6.8 6 8 3.4-1.2 6-4.3 6-8v-5z" fill="none" stroke="#1C6FE0" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span><b>Your work stays on your device.</b> Everything you create is saved in this browser only and is never sent to a server. Use the export or backup option in each tool to keep a copy.</span></div>
</main>
<script src="shared/nav.js?v=2" data-root="./"></script>
<script>
(function(){
  var ICONS={
    timeline:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="9" height="3.5" rx="1.2" fill="currentColor"/><rect x="8" y="10.25" width="11" height="3.5" rx="1.2" fill="currentColor" opacity=".55"/><rect x="5" y="15.5" width="8" height="3.5" rx="1.2" fill="currentColor"/></svg>',
    tracker:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5 5.5 8 8 5M4 12.5 5.5 14 8 11M4 18.5 5.5 20 8 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.5 6.5H20M11.5 12.5H20M11.5 18.5H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    kpi:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="13" width="4" height="7" rx="1.2" fill="currentColor"/><rect x="10" y="9" width="4" height="11" rx="1.2" fill="currentColor"/><rect x="16" y="4" width="4" height="16" rx="1.2" fill="currentColor"/></svg>',
    risk:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1.2" fill="currentColor" opacity=".35"/><rect x="9.5" y="3" width="5" height="5" rx="1.2" fill="currentColor" opacity=".65"/><rect x="16" y="3" width="5" height="5" rx="1.2" fill="currentColor"/><rect x="3" y="9.5" width="5" height="5" rx="1.2" fill="currentColor" opacity=".2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.2" fill="currentColor" opacity=".35"/><rect x="16" y="9.5" width="5" height="5" rx="1.2" fill="currentColor" opacity=".65"/><rect x="3" y="16" width="5" height="5" rx="1.2" fill="currentColor" opacity=".12"/><rect x="9.5" y="16" width="5" height="5" rx="1.2" fill="currentColor" opacity=".2"/><rect x="16" y="16" width="5" height="5" rx="1.2" fill="currentColor" opacity=".35"/></svg>',
    wbs:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="9" y="3" width="6" height="4.5" rx="1"/><rect x="2.5" y="16.5" width="6" height="4.5" rx="1"/><rect x="15.5" y="16.5" width="6" height="4.5" rx="1"/><path d="M12 7.5v4.5M5.5 16.5V12h13v4.5"/></svg>'
  };
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  PMHub.tools.then(function(tools){
    function card(t){
      var live=t.status==="live", ic=ICONS[t.icon]||ICONS.timeline;
      var body='<div class="tool-ic">'+ic+'</div><h2>'+esc(t.name)+'</h2><p>'+esc(t.description)+'</p>';
      var by=byline(t.builders||[],live);
      // tools still being built show as a blurred preview: the group title says what is coming, the builders stay readable
      return live?'<a class="tool" href="'+esc(t.path)+'">'+body+'<div class="tool-foot">'+by+'<span class="go">Open tool →</span></div></a>':'<div class="tool soon">'+body.replace('<div class="tool-ic">','<div class="tool-ic" aria-hidden="true">')+by+'</div>';
    }
    // "Built by" line: initials avatars plus names, from the builders list in tools.json
    function initials(n){var p=String(n).trim().split(/\s+/);return ((p[0]||"")[0]||"").toUpperCase()+((p.length>1?p[p.length-1][0]:"")||"").toUpperCase()}
    function byline(b,live){
      if(!b.length)return "";
      var names=b.map(function(x){return '<b>'+esc(x.name)+'</b>'});
      var list=names.length<3?names.join(" &amp; "):names.slice(0,-1).join(", ")+" &amp; "+names[names.length-1];
      return '<div class="by"><span class="avs" aria-hidden="true">'+b.slice(0,4).map(function(x){return '<span class="av" title="'+esc(x.name)+'">'+esc(initials(x.name))+'</span>'}).join("")+'</span><span>'+(live?"Built by ":"Being built by ")+list+'</span></div>';
    }
    // groups appear in the order tools.json first mentions them
    var groups=[];
    tools.forEach(function(t){var g=t.group||"Tools";if(groups.indexOf(g)<0)groups.push(g)});
    document.getElementById("tools").innerHTML=groups.map(function(g){
      return '<section aria-label="'+esc(g)+'"><h2 class="group-title">'+esc(g)+'</h2><div class="tools">'+tools.filter(function(t){return (t.group||"Tools")===g}).map(card).join("")+'</div></section>';
    }).join("");
  });
})();
</script>
</body>
</html>
